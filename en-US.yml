wb_guide_book_2: "EventWar is a highly-customizable war plugin made by LlmDl, the lead developer of Towny."
wb_guide_book_3: "This guidebook will explain how EventWar is configured on this server."
wb_guide_book_4: "EventWar has 6 war types:"
