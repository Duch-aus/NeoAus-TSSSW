wb_war_tokens_header: "War Tokens"
wb_war_tokens_enabled: "  War Tokens are how a town initiates a war. War Tokens on this server are %s."
wb_war_tokens_disabled: "With tokens disabled, only admins can initiate wars using the /ta war command."
wb_war_tokens_1: "Every new Towny Day each town will receive %s war token(s) if they are: "
wb_war_tokens_2: " - Not involved in an active war."
wb_war_tokens_3: " - Not peaceful."
wb_war_tokens_4: " - Not part of a nation which is peaceful."
wb_war_tokens_4_5: " - Not currently protected from wars via new town immunity."
wb_war_tokens_5: "War Tokens are redeemed for Declarations of War, "
wb_war_tokens_6: "which are special books used to start wars."
wb_war_tokens_7: "To purchase a Declaration of War using your town's tokens use the /town redeem command."
wb_war_tokens_dow_restricted: "Declarations of War are restricted to the Town which bought them. The purchasing Town will be part of the war that uses the book."
wb_war_tokens_dow_unrestricted: "Declarations of War can be bought by a town and then given to another town, to foment wars."
wb_war_tokens_admin_started: "Wars can also be started by server admins using the /ta war command."
wb_token_costs: "The amount of tokens required to purchase the various DoWs are as follows:"
wb_token_cost_riot: " - Riot DoW Cost: "
wb_token_cost_townwar: " - Town vs Town DoW Cost: "
wb_token_cost_civilwar: " - Civil War DoW Cost: "
wb_token_cost_independencewar: " - Independence War DoW Cost: "
wb_token_cost_nationwar: " - Nation vs Nation DoW Cost: "
wb_token_cost_nationvstownwar: " - Nation vs Town DoW Cost: "
wb_token_cost_alliancewar: " - Alliance vs Alliance DoW Cost: "
wb_token_cost_worldwar: " - World War DoW Cost: "


wb_global_war_settings: "Global War Settings:"
wb_immunity: "New Town Immunity: "
wb_immunity_1: "Your server has new Town Immunity enabled."
wb_immunity_2: "Your server has new Town Immunity disabled."
wb_immunity_3: "New town immunity lasts for %s after a town is created. "
wb_immunity_4: "While immune a town does not earn war tokens. "
wb_immunity_5: "While immune a town does earn war tokens. "
wb_conquering: "Conquering: "
wb_conquering_1: "  Some war types have conquering or take overs. When a nation conquers another town, that town will be conquered for %s days, unable to leave their nation."
wb_conquering_2: "  Towns which are the capital of a nation will not be conquered when they are removed from a nation war or world war."
wb_conquering_3: "  Conquered towns' residents will not be allowed to leave their town."
wb_occupationalcontrol: "Occupational Control: "
wb_occupationalcontrol_1: "  Town War and Nation War can result in wars ending with Occupational Control over the losing town or nation. When this happens the town or nation capital will be under Occupational Control for %s."
wb_occupationalcontrol_2: "  On this server Occupational Control is %s for town wars, %s for nation wars and %s for alliance wars."
wb_occupationalcontrol_3: "  While Occupational Control is held, an occupied town (or occupied nation capital,) can have its residents added and removed changed by the occupying mayor."
wb_occupationalcontrol_4: "  Similarly, an occupied town (or an occuped nation capital,) can have its mayor (or nation leader,) changed by the occupying mayor."
wb_surrendering: "Surrendering: "
wb_surrendering_1: "  Some war types have surrendering enabled. There are two types of surrendering: basic and offered. "
wb_surrendering_2: "  Riots, Civil Wars, Independence Wars, Nation vs Town Wars, and World Wars use the basic type of surrendering. This is executed by using the /surrender command. "
wb_surrendering_3: "Any player can surrender in a Riot. Only mayors are able to surrender a Civil War. Only a king may surrender in a World War."
wb_surrendering_4: "  If conquering is enabled a mayor will lose their Town if they surrender a Riot. Likewise, a king will lose their Nation if they surrender a Civil War."
wb_surrendering_5: "  Town Wars, Nation Wars and Alliance Wars use the offered type of surrender. "
wb_surrendering_6: "The leader of the town or nation has 4 types of offer they can make for surrendering. These are: "
wb_surrendering_7: " - WhitePeace (nothing given.)"
wb_surrendering_8: " - Money"
wb_surrendering_9: " - Towns"
wb_surrendering_10: " - Money & Towns"
wb_surrendering_11: "  The Commands for these surrendering options can be seen using the /surrender ? command."
wb_surrendering_12: "  Once a surrender is offered, the mayor or king of the opposite side in the war will have 3 minutes to accept or deny the surrender. "
wb_surrendering_13: "When an offer is accepted the war will end and any money or towns will be transferred to the winning side. "
wb_surrendering_14: "When it is denied the war will continue."
wb_winning_wars: "Winning Wars: "
wb_winning_wars_1: "  When a war ends, the points scored by the players, or towns, or nations, will determine who gets the spoils of war."
wb_winning_wars_2: "  In most cases half of the spoils go to the top scorer with the other half being split up among the remaining survivors."
wb_winning_wars_3: "  Wars can have pre-determined end times, or pre-determined winning scores. Check the war type sections of this book to learn which war types have end times or winning scores set in place."
wb_points: "Points: "
wb_points_1: " - When TownBlockHP is enabled in a war type, dropping a TownBlock to 0 hp will give %s points."
wb_points_2: " - Removing a Town from a war will result in %s points."
wb_points_3: " - Removing a Nation from a war will result in %s points."
wb_points_4: " - Each war type has separate points for killing other players."
wb_money: "Money: "
wb_money_enabled: "  EventWar's economy setting is %s."
wb_money_1: " - If TownBlockHP is used for a war type, and a TownBlock's HP is dropped to 0, that will cost the town %s."
wb_money_2: " - When a player kills another player it will cost them %s. If the player cannot pay the balance, it will be taken from their town's bank."
wb_money_3: " - If the Town cannot pay for these costs they will be removed from the war."
wb_money_4: " - These costs will be added to the WarSpoils and awarded amongst the winners of the war."
wb_money_5: " - These costs will be awared to the player or town which has scored."
wb_townblocks: "TownBlocks: "

wb_townblocks_1: "  When TownBlockHP is enabled for a War Type the following settings apply:"
wb_townblocks_2: " - Healing: %s, can friendly players heal the HP of a TownBlock?"
wb_townblocks_3: " - Normal TownBlock HP: %s HP."
wb_townblocks_4: " - Homeblock HP: %s HP."
wb_townblocks_5: " - To attack a TownBlock's HP you must be at least at y level %s."
wb_townblocks_5.5: " - To attack a TownBlock's HP the Town must have at least %s players online."
wb_townblocks_6: " - Ignore invisible players: %s."
wb_townblocks_7: " - Costs TownBlocks: %s, when enabled, losing a TownBlock affects the amount of TownBlocks your town can claim, with the winner gaining an available TownBlock."
wb_townblocks_8: "  To attack a TownBlock's HP you must start with a TownBlock on the edge of a Town. "
wb_townblocks_9: "You can see which TownBlocks are attackable by looking at the boss bar while stood in a plot, as well as the colour of the wool in the holograms that will appear showing TownBlock HP. "
wb_townblocks_9.5: "When a TownBlock has HP and is attackable a green wool block will appear in the hologram. When it is unattackable it will show a yellow wool block. When a TownBlock has fallen and has no HP left it will show a red wool block. "
wb_townblocks_10: "After dropping a TownBlock to 0 HP you can move inwards towards a Town's home TownBlock. "
wb_townblocks_11: "If a TownBlock has not been dropped to 0 HP, friendly players can heal the TownBlock's HP by standing in it and outnumbering any attackers. "
wb_townblocks_12: "If a Town has their HomeBlock dropped to 0 HP they will be removed from the war. "
wb_townblocks_13: "If that town is a Capital involved in a Civil, Nation or World War, the Nation will be removed from the war. "
wb_townblocks_14: "In TownWar, NationWar, AllianceWar and WorldWar is it possible for TownBlocks to change ownership, to the town which conquered it, see the guide sections for those war types to see if this is enabled on your server."
wb_townblocks_15: "In TownWar, NationWar, AllianceWar and WorldWar is it sometimes possible for TownBlocks that have changed ownership to be resurrected after a time period, allowing them to be fought over again, see the guide sections for those war types to see if this is enabled on your server."
wb_townblocks_singleuse: " - TownBlocks that have been dropped to 0HP will be resurrected and be able to be re-conquered after %s."

wb_jails: "Jails: "
wb_jails_1: "  Towny's Jail plots will be used to house attacking enemies who have been killed in an enemy town."
wb_jails_2: "Make sure your Town has at least one jail plot made. The Prisoners of War will be sent to your Town's Primary Jail."
wb_jails_3: "You can set your Town's primary jail using /town set primaryjail while standing in one of your Town's jail plots."
wb_jails_4: "When an attacker has been killed in your lands and you have a jail plot which has not has its HP dropped to 0, that attacker becomes a Prisoner of War."
wb_jails_5: "They will spawn in your jail and remain there, unable to score points or attack TownBlocks until they have been freed."
wb_jails_6: "In order to be freed the player has a few options:"
wb_jails_7: " - In a Riot war they have to exit the Jail plot."
wb_jails_8: " - In any other war type they have to escape into the Wilderness."
wb_jails_9: " - If the Jail plot's HP is dropped to 0 HP by attackers, a jail break will happen and everyone jailed there will become freed."
wb_jails_10: "This server allows for explosions to regenerate in Towns which are at war, attackers should attempt to use their explosives to try to break the walls of Jail plots, in order to free their jailed teammates. Block will regenerate after 60 seconds, so make sure you're quick."
wb_jails_11: "  Towny is not configured to jail attacking enemies, the prisoner of war feature won't be used."

wb_battlesessions: "BattleSessions: "
wb_battlesessions_1: "  BattleSessions are not enabled on this server, war will be fought continuously until it is over."
wb_battlesessions_2: "  BattleSessions are enabled on this server, war scoring and points will only count while the BattleSession is active. "
wb_battlesessions_3: "BattleSessions last for %s after the start time. "
wb_battlesessions_4: "Every day of the week can have different BattleSession start times. They are as follows: "
wb_battlesessions_5: " * Sunday: %s."
wb_battlesessions_6: " * Monday: %s."
wb_battlesessions_7: " * Tuesday: %s."
wb_battlesessions_8: " * Wednesday: %s."
wb_battlesessions_9: " * Thursday: %s."
wb_battlesessions_10: " * Friday: %s."
wb_battlesessions_11: " * Saturday: %s."
wb_battlesessions_12: "  Make sure you are ready to attack players and townblocks while the BattleSession is active!"
wb_battlesessions_13: "  You can look up information about the active or next BattleSession using '/eventwar battlesession'. "
wb_battlesessions_14: "You can look see the BattleSession status as a bossbar using '/eventwar battlesession bossbar'. "


wb_war_type_settings: "War Types Settings"
wb_war_type_settings_1: "  Each War Type has a number of settings, these include:"
wb_war_type_settings_2: " - cooldown: How much time must pass between a town's last war (of any type) before the town can take part in a war of this type."
wb_war_type_settings_3: " - min online: How many people have to be online in the town or nation for a war to begin."
wb_war_type_settings_4: " - min online ignores low pop: Allows wars on low pop towns and nations as long as the entire town is online."
wb_war_type_settings_5: " - max duration: How long a war will last before it ends automatically and the points balance determine who wins."
wb_war_type_settings_5_5: " - winning score: The score that will cause a player or town to win the war. Reach this to end the war."
wb_war_type_settings_6: " - surrender allowed: Is surrendering enabled for a war type."
wb_war_type_settings_7: " - resident lives: How many lives a resident gets before they are knocked out of the war."
wb_war_type_settings_8: " - mayor lives: How many lives a mayor gets before they are knocked out of the war."
wb_war_type_settings_9: " - mayor death: If a mayor loses all of their lives, is their town removed from the war?"
wb_war_type_settings_10: " - base spoils: How much money is up for grabs at the start of a war."
wb_war_type_settings_11: " - points per kill: How many points are gained for killing another player."
wb_war_type_settings_12: " - neutrality: Can a nation or town use neutrality to avoid a war.?"
wb_war_type_settings_13: " - build/destroy: Are enemies allowed to build and destroy the list of editable materials in war zones?"
wb_war_type_settings_14: " - switch use: Are enemies allowed to use switches in war zones?"
wb_war_type_settings_15: " - item use: Are enemies allowed to use items in war zones?"

